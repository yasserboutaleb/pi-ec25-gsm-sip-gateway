; chan_quectel: Quectel EC25 (or another Quectel module with the same AT set) owned by the gateway.
; The driver owns the module: call control, SMS and USSD go through the data port.
[general]
interval = 15            ; seconds between two attempts to open a missing modem
smsdb = :memory:

[defaults]
context = from-gsm
group = 0
rxgain = -1
txgain = -1
; SMS: the module announces each SMS (+CMTI), the driver reads it (AT+CMGR) then deletes it, so the
; storage never fills up. Set explicitly: the module's own setting may differ from one unit to another.
msg_direct = off
autodeletesms = yes
resetmodem = no
usecallingpres = no
callwaiting = auto       ; leave call waiting as set by the operator
multiparty = no
dtmf = off
qhup = on
initstate = start
; Call states: +QIND "ccinfo" notifications AND AT+CLCC polling, which recovers a call whose
; notification was lost (0 = notifications only).
clcc_poll = @CLCC_POLL@

[quectel0]
data = @DATA_PORT@
slin16 = off             ; the EC25 voice path is 8 kHz
;#BEGIN uac — voice over USB audio (UAC): the module shows up as an ALSA sound card
uac = on
alsadev = @ALSA_DEVICE@
;#END uac
;#BEGIN serial — voice over a serial port (modules without USB audio)
uac = off
audio = @AUDIO_PORT@
;#END serial
