; PJSIP. gw-config fills in the values from the environment and removes the disabled blocks
; (;#BEGIN name ... ;#END name).

[global]
type = global
user_agent = pi-ec25-gsm-sip-gateway
keep_alive_interval = 30

[transport-udp]
type = transport
protocol = udp
bind = @SIP_BIND@:@SIP_PORT@

;#BEGIN softphone — SIP softphone on the LAN (SOFTPHONE_PASSWORD not empty)
; endpoint and AOR named after the account: Asterisk finds the endpoint by the From user
[@SOFTPHONE_USERNAME@]
type = endpoint
context = from-sip
message_context = sms-out
disallow = all
allow = alaw,ulaw
direct_media = no
rtp_symmetric = yes
force_rport = yes
rewrite_contact = yes
dtmf_mode = rfc4733
auth = softphone-auth
aors = @SOFTPHONE_USERNAME@
rtp_timeout = 60         ; answered call without RTP for 60 s: hung up (lost softphone, the GSM call would stay open)
; accepted only from SOFTPHONE_NETWORK and the loopback
deny = 0.0.0.0/0.0.0.0
permit = @SOFTPHONE_NETWORK@
permit = 127.0.0.1/255.255.255.255

[softphone-auth]
type = auth
auth_type = userpass
username = @SOFTPHONE_USERNAME@
password = @SOFTPHONE_PASSWORD@

[@SOFTPHONE_USERNAME@]
type = aor
max_contacts = 1
remove_existing = yes
qualify_frequency = 30
;#END softphone

;#BEGIN server — remote SIP server or PBX (SERVER_ENABLED=1)
[server-aor]
type = aor
contact = sip:@SERVER_HOST@:@SERVER_PORT@
qualify_frequency = 60

[server]
type = endpoint
context = from-sip
message_context = sms-out
disallow = all
allow = @SERVER_CODEC@
aors = server-aor
direct_media = no
rtp_symmetric = yes
dtmf_mode = rfc4733
; If the server or the network goes down during a call, no BYE arrives: without this timeout the
; GSM call would stay open (and charged). Only counts once the call is answered.
rtp_timeout = 60
; Never identified by the From user: the endpoint has no inbound password, and anyone could put
; "server" in From. register mode: requests are accepted on the registered line only (no
; identify section, so nothing matches by address); ip mode: by the address of the server.
identify_by = ip
;#BEGIN register — the gateway logs in with its account: From = account, GSM caller's number
; as display name and in P-Asserted-Identity
outbound_auth = server-auth
from_user = @SERVER_USERNAME@
from_domain = @SERVER_HOST@
send_pai = yes
force_rport = yes
rewrite_contact = yes
;#END register
;#BEGIN ip — trusted peer (same LAN or a VPN of the host): identified by its address, no password

[server-identify]
type = identify
endpoint = server
match = @SERVER_HOST@
;#END ip

;#BEGIN register
[server-auth]
type = auth
auth_type = userpass
username = @SERVER_USERNAME@
password = @SERVER_PASSWORD@

; Registration: the server sends its calls to the gateway's contact, even behind NAT
; (line: requests received on this line belong to the server endpoint).
[server-reg]
type = registration
outbound_auth = server-auth
server_uri = sip:@SERVER_HOST@:@SERVER_PORT@
client_uri = sip:@SERVER_USERNAME@@@SERVER_HOST@:@SERVER_PORT@
contact_user = @SERVER_USERNAME@
line = yes
endpoint = server
expiration = 300
retry_interval = 60
forbidden_retry_interval = 600
max_retries = 1000000
;#END register
;#END server
