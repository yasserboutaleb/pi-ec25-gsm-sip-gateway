; Call progress tones. The driver reports "progress" as soon as the number is dialled, so the
; gateway answers the SIP call with early media (183) and generates the ringback tone itself in that
; media when RINGBACK=local. COUNTRY selects the tones; gw-config appends every country of the
; indications.conf shipped with Asterisk after the section below.
[general]
country = @COUNTRY@
