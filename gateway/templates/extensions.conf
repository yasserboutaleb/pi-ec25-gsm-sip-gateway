; Dialplan of the gateway. gw-config fills in the values from the environment.
; Numbers in the log are masked (first 4 characters only).
[general]
static = yes
writeprotect = yes

[globals]
GSM_DEV = quectel0
GSM_ECHO_TEST = @GSM_ECHO_TEST@     ; 1 = incoming GSM calls are answered and echoed back (audio test)
SERVER_ON = @SERVER_ON@             ; remote SIP server or PBX enabled
SERVER_MODE = @SERVER_MODE@         ; register or ip
SERVER_HOST = @SERVER_HOST@
SERVER_PORT = @SERVER_PORT@
SERVER_EXT = @SERVER_EXTENSION@     ; extension of the server that receives GSM calls, SMS and USSD replies
SERVER_USER = @SERVER_USERNAME@     ; gateway account (register mode)
LOCAL_ADDR = @SERVER_LOCAL_ADDRESS@ ; ip mode: address of the gateway as seen by the server (host part of the SMS From)
SOFTPHONE_ON = @SOFTPHONE_ON@
SOFTPHONE_EP = @SOFTPHONE_USERNAME@ ; endpoint of the softphone (named after its account)
GSM_IN_DIAL = @GSM_IN_DIAL@         ; destinations of incoming GSM calls (INCOMING_CALLS_TO)
USSD_ENABLED = @USSD_ENABLED@
USSD_LOG_TEXT = @USSD_LOG_TEXT@     ; 1 = text of USSD replies written in the log, for local tools
RINGBACK = @RINGBACK_OPT@           ; "r" = ringback tone generated by the gateway; empty = the network's own
NET_JB = @JITTER_BUFFER@            ; jitter buffer on the voice received from SIP: adaptive, fixed or off
DIAL_ALLOW = @DIAL_ALLOW@           ; numbers allowed for calls and SMS (extended regex); empty = any

; Jitter buffer on the SIP side of a call, read direction (voice from the network, written to the
; modem). With USB audio the driver must feed the module at a steady pace: voice arriving in bursts
; (VPN, Wi-Fi, Internet) empties the playback buffer, the stream stops (XRUN), and capture stops
; with it since both streams are linked: silence both ways. Values: max 200 ms, resync after a
; 1000 ms jump, 40 ms of extra delay for the adaptive buffer.
[net-jb]
exten => s,1,ExecIf($["${NET_JB}" != "off"]?Set(JITTERBUFFER(${NET_JB})=200,1000,40))
 same => n,Return()

; ---------------------------------------------------------------- GSM -> SIP
[from-gsm]
; Incoming GSM call. The GSM call is answered only when the SIP side answers: the caller hears the
; ringback of their own network, is not charged while nobody answers, and reaches the operator's
; voicemail if nobody answers, like with an ordinary phone.
exten => s,1,Set(EVNUM=${FILTER(+0123456789,${CALLERID(num)})})
 same => n,GotoIf($["${GSM_ECHO_TEST}" = "1"]?echo)
 same => n,GotoIf($["${GSM_IN_DIAL}" = ""]?busy)
; register mode: the From header carries the gateway account, so the caller's number is sent as
; the display name (and in P-Asserted-Identity)
 same => n,GotoIf($["${SERVER_MODE}" != "register"]?dial)
 same => n,Set(CALLERID(name)=${CALLERID(num)})
 same => n(dial),Dial(${GSM_IN_DIAL},60,b(net-jb^s^1))
; Destination unreachable or busy: rejected as "busy" (cause 17), so the operator applies call
; forwarding on busy (voicemail). No answer within 60 s: normal hang-up.
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION" | "${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Hangup()
 same => n(busy),Set(DIALSTATUS=REJECTED)
 same => n,Hangup(17)
 same => n(echo),Set(DIALSTATUS=ECHO)
 same => n,Answer()
 same => n,Echo()
exten => _[+0-9].,1,Goto(s,1)
exten => h,1,GotoIf($[${LEN(${EVNUM})} = 0]?end)
 same => n,Log(NOTICE,call in ${EVNUM:0:4}... ${DIALSTATUS} ${ANSWEREDTIME})
 same => n(end),NoOp()

; SMS received by the driver (JSON in ${SMS}; CALLERID(num) = sender) -> SIP MESSAGE
exten => sms,1,Set(MESSAGE(body)=${JSON_DECODE(SMS,msg)})
 same => n,Set(MSGFROM=${FILTER(+0-9A-Za-z,${CALLERID(num)})})
 same => n,GotoIf($["${MSGFROM}" != ""]?send)
 same => n,Set(MSGFROM=sms)
 same => n(send),Log(NOTICE,sms in ${MSGFROM:0:4}... ${LEN(${MESSAGE(body)})} chars)
 same => n,Goto(msg-to-sip,s,1)

; USSD reply (JSON in ${USSD}) -> SIP MESSAGE from "ussd"
exten => ussd,1,Set(MESSAGE(body)=${JSON_DECODE(USSD,ussd)})
 same => n,GotoIf($[${LEN(${MESSAGE(body)})} > 0]?send)
 same => n,Set(MESSAGE(body)=USSD: ${JSON_DECODE(USSD,type_description)})
 same => n(send),Log(NOTICE,ussd reply ${LEN(${MESSAGE(body)})} chars)
; USSD_LOG_TEXT=1: the reply also in the log, in the driver's own format, read by local tools (a
; status page of the host, for menus such as payments). Off by default: it may hold a balance or codes.
 same => n,GotoIf($["${USSD_LOG_TEXT}" != "1"]?msg)
 same => n,Set(USSDTXT=${MESSAGE(body)})
 same => n,Log(NOTICE,Got USSD type ${JSON_DECODE(USSD,type)} '${JSON_DECODE(USSD,type_description)}': [${USSDTXT}])
 same => n(msg),Set(MSGFROM=ussd)
 same => n,Goto(msg-to-sip,s,1)

; SMS delivery report: not used
exten => report,1,Hangup()

; USSD sent by a local tool, without a SIP call (USSD_ENABLED=1); the reply follows exten "ussd" above:
;   asterisk -rx "channel originate Local/s@ussd-console application QUECTEL_SEND_USSD quectel0,*100#"
[ussd-console]
exten => s,1,GotoIf($["${USSD_ENABLED}" != "1"]?refuse)
 same => n,Answer()
 same => n,Wait(10)
 same => n,Hangup()
 same => n(refuse),Hangup(21)

; ---------------------------------------------------------------- SIP -> GSM
; Calls from the softphone or from the server
[from-sip]
; 9600: echo test of the gateway itself (SIP and RTP path, no GSM call)
exten => 9600,1,Answer()
 same => n,Echo()
 same => n,Hangup()
; USSD: dial the code (*100#, %23 is read as #); confirmation tone, the reply comes back as a MESSAGE
exten => _[*#].,1,GotoIf($["${USSD_ENABLED}" != "1"]?refuse)
 same => n,Set(USSDCODE=${FILTER(0123456789*#,${STRREPLACE(EXTEN,%23,#)})})
 same => n,GotoIf($[${LEN(${USSDCODE})} < 2 | ${LEN(${USSDCODE})} != ${LEN(${STRREPLACE(EXTEN,%23,#)})}]?refuse)
 same => n,Log(NOTICE,ussd request ${USSDCODE:0:4}... ${LEN(${USSDCODE})} chars)
 same => n,QUECTEL_SEND_USSD(${GSM_DEV},${USSDCODE})
 same => n,Answer()
 same => n,Playtones(info)
 same => n,Wait(2)
 same => n,Hangup()
 same => n(refuse),Hangup(21)
; Any number: national format or +international. Anything else in the number (a "&" or a "," would
; add a channel or options to Dial) is refused. Done in extension "dial", so that Log() never writes the
; full number as its extension.
exten => _[+0-9].,1,Set(NUMIN=${EXTEN})
 same => n,Goto(dial,1)
exten => dial,1,Set(EVNUM=${FILTER(+0123456789,${NUMIN})})
 same => n,GotoIf($[${LEN(${EVNUM})} = 0 | ${LEN(${EVNUM})} != ${LEN(${NUMIN})}]?refuse)
; DIAL_ALLOW: a stolen softphone password must not reach premium or international numbers
 same => n,GotoIf($[${LEN(${DIAL_ALLOW})} = 0]?allowed)
 same => n,GotoIf($[${REGEX("${DIAL_ALLOW}" ${EVNUM})} = 0]?denied)
 same => n(allowed),Gosub(net-jb,s,1)
 same => n,Dial(Quectel/${GSM_DEV}/${EVNUM},120,${RINGBACK})
 same => n,Hangup()
 same => n(denied),Set(EVNUM=)
 same => n,Log(WARNING,call refused: number not allowed by DIAL_ALLOW)
 same => n,Hangup(21)
 same => n(refuse),Set(EVNUM=)
 same => n,Log(WARNING,call refused: invalid number)
 same => n,Hangup(1)
exten => h,1,GotoIf($[${LEN(${EVNUM})} = 0]?end)
 same => n,Log(NOTICE,call out ${EVNUM:0:4}... ${DIALSTATUS} ${ANSWEREDTIME})
 same => n(end),NoOp()

; ---------------------------------------------------------------- SMS <-> SIP MESSAGE
; SIP MESSAGE to a number -> SMS. The text is passed quoted, never interpreted.
[sms-out]
; The work is done in extension "send": Log() writes its extension in the log line, which must never
; be the full number.
exten => _[+0-9].,1,Set(NUMIN=${EXTEN})
 same => n,Goto(send,1)
exten => send,1,Set(NUM=${FILTER(+0123456789,${NUMIN})})
 same => n,GotoIf($[${LEN(${NUM})} = 0 | ${LEN(${NUM})} != ${LEN(${NUMIN})} | ${LEN(${MESSAGE(body)})} = 0]?refuse)
 same => n,GotoIf($[${LEN(${DIAL_ALLOW})} = 0]?allowed)
 same => n,GotoIf($[${REGEX("${DIAL_ALLOW}" ${NUM})} = 0]?denied)
 same => n(allowed),Log(NOTICE,sms out ${NUM:0:4}... ${LEN(${MESSAGE(body)})} chars)
; validity 1440 min (1 day; the driver's default is 15 min), no delivery report
 same => n,QUECTEL_SEND_SMS(${GSM_DEV},${NUM},${QUOTE(${MESSAGE(body)})},1440,no)
 same => n,Hangup()
 same => n(denied),Log(WARNING,sms out refused: number not allowed by DIAL_ALLOW)
 same => n,Hangup()
 same => n(refuse),Log(WARNING,sms out refused: invalid number or empty text)
 same => n,Hangup()

; Sends a SIP MESSAGE (body already in MESSAGE(body)) on behalf of MSGFROM (number, name, "ussd"):
; to the server if it is enabled, otherwise to the softphone.
;  - ip mode: From = <sip:MSGFROM@SERVER_LOCAL_ADDRESS> (the server reads the number from the user part)
;  - register mode: From = "MSGFROM" <sip:account@server> (the server knows the gateway by its account)
[msg-to-sip]
exten => s,1,GotoIf($["${SERVER_ON}" != "1"]?softphone)
 same => n,Set(MESSAGE(to)=sip:${SERVER_EXT}@${SERVER_HOST})
 same => n,GotoIf($["${SERVER_MODE}" = "register"]?reg)
 same => n,MessageSend(pjsip:server/sip:${SERVER_EXT}@${SERVER_HOST}:${SERVER_PORT},<sip:${MSGFROM}@${LOCAL_ADDR}>)
 same => n,Goto(status)
 same => n(reg),MessageSend(pjsip:server/sip:${SERVER_EXT}@${SERVER_HOST}:${SERVER_PORT},"${MSGFROM}" <sip:${SERVER_USER}@${SERVER_HOST}>)
 same => n,Goto(status)
 same => n(softphone),GotoIf($["${SOFTPHONE_ON}" != "1"]?none)
 same => n,Set(MESSAGE(to)=sip:${SOFTPHONE_EP})
 same => n,MessageSend(pjsip:${SOFTPHONE_EP},<sip:${MSGFROM}@${LOCAL_ADDR}>)
 same => n,Goto(status)
 same => n(none),Set(MESSAGE_SEND_STATUS=NO_DESTINATION)
 same => n(status),GotoIf($["${MESSAGE_SEND_STATUS}" = "SUCCESS"]?end)
 same => n,Log(WARNING,message to SIP not delivered: ${MESSAGE_SEND_STATUS})
 same => n(end),Hangup()
